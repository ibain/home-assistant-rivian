send_destination:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: rivian
    location:
      required: true
      example: "Costco Wholesale, 1051 W Burbank Blvd, Burbank, CA 91506"
      selector:
        text:
    wake:
      default: true
      selector:
        boolean:
    replace:
      default: true
      selector:
        boolean:

end_trip:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: rivian

plan_trip:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: rivian
    location:
      required: true
      example: "Costco Goleta"
      selector:
        text:
    departure_time:
      required: false
      selector:
        datetime:
