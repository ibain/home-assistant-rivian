blueprint:
  name: "Rivian: send calendar events to the vehicle when it's time to leave"
  description: >-
    Ahead of each calendar event with a location, ask Rivian's trip planner how long
    the trip takes from where the vehicle is, send the destination early (if nothing
    else is coming up first), and send it again just in time, so it's back if a trip
    in between replaced it. Never sends while the vehicle is moving. Needs the Rivian
    (Unofficial) integration's rivian.plan_trip and rivian.send_destination actions.
  domain: automation
  source_url: https://github.com/ibain/home-assistant-rivian/blob/fork/main/custom_components/rivian/blueprints/time_to_leave.yaml
  input:
    vehicle:
      name: Vehicle
      selector:
        device:
          integration: rivian
    gear_sensor:
      name: Gear Selector (optional)
      description: >-
        The selected vehicle's Gear Selector sensor; sends wait for it to read Park.
        Leave empty to use the vehicle's own gear sensor automatically; pick it only
        if you renamed that entity.
      default: ""
      selector:
        entity:
          domain: sensor
          integration: rivian
    calendars:
      name: Calendars
      description: Events with a location on these calendars are sent to the vehicle.
      selector:
        entity:
          domain: calendar
          multiple: true
    look_ahead:
      name: Look ahead
      description: How long before an event to plan the trip (and send it early).
      default:
        hours: 3
      selector:
        duration: {}
    send_mode:
      name: When to send
      description: >-
        Early: at the look-ahead point, if no other event with a location comes first.
        Just in time: at start minus travel time minus the buffer. Both (default) sends
        early and again just in time, so a trip you loaded in between doesn't cost you
        the destination.
      default: both
      selector:
        select:
          options:
            - label: Early and just in time
              value: both
            - label: Early only
              value: early
            - label: Just in time only
              value: just_in_time
    traffic_factor:
      name: Traffic factor
      description: >-
        Rivian's planner gives free-flow drive times. Drive time is multiplied by this
        for the leave-by time (charging time is not).
      default: 1.5
      selector:
        number:
          min: 1
          max: 3
          step: 0.1
    google_entry:
      name: Google Travel Time (optional)
      description: >-
        A Google Travel Time integration entry. When set, Google's traffic-aware drive
        time replaces the planner's drive time times the traffic factor. Charging time
        still comes from Rivian's planner.
      default: ""
      selector:
        config_entry:
          integration: google_travel_time
    buffer_minutes:
      name: Buffer
      description: Minutes of slack before the leave-by time.
      default: 15
      selector:
        number:
          min: 0
          max: 180
          unit_of_measurement: min
    include_charging:
      name: Include charging time
      description: Count the planner's charging stops in the travel time.
      default: true
      selector:
        boolean: {}
    replace:
      name: Replace the current trip
      description: End whatever trip is loaded before sending. Off adds the destination as a stop.
      default: true
      selector:
        boolean: {}
    max_park_wait:
      name: Longest wait for Park
      description: Sends wait for the vehicle to be parked; give up after this long.
      default:
        hours: 2
      selector:
        duration: {}
    earliest_time:
      name: Earliest send time
      description: Never send before this time of day. Skip sends delayed past the event start.
      default: "06:00:00"
      selector:
        time: {}
    skip_pattern:
      name: Skip events matching
      description: >-
        Regular expression; events whose location or title matches are skipped.
        The default skips meeting links. Leave empty to skip nothing.
      default: "://"
      selector:
        text: {}
    notify_service:
      name: Notify action (optional)
      description: >-
        An action to call when a destination is sent, for example
        notify.mobile_app_my_phone. Leave empty for no notification.
      default: ""
      selector:
        text: {}

mode: parallel
max_exceeded: silent

triggers:
  - trigger: calendar.event_started
    target:
      entity_id: !input calendars
    options:
      offset: !input look_ahead
      offset_type: before

variables:
  vehicle: !input vehicle
  gear_input: !input gear_sensor
  gear_sensor: >-
    {{ gear_input or (device_entities(vehicle) | select('search', 'gear_selector') | first | default('')) }}
  calendars: !input calendars
  send_mode: !input send_mode
  traffic_factor: !input traffic_factor
  google_entry: !input google_entry
  buffer_minutes: !input buffer_minutes
  include_charging: !input include_charging
  replace: !input replace
  earliest_time: !input earliest_time
  skip_pattern: !input skip_pattern
  notify_service: !input notify_service
  title: "{{ trigger.calendar_event.summary | default('', true) }}"
  start: "{{ trigger.calendar_event.start }}"
  location: >-
    {{ trigger.calendar_event.location | default('', true)
       | replace('\n', ', ') | regex_replace('\\s{2,}', ' ') | trim }}

conditions:
  - condition: template
    value_template: "{{ gear_sensor != '' and gear_sensor in device_entities(vehicle) }}"
  - condition: template
    value_template: >-
      {{ location != '' and 'T' in start
         and not (skip_pattern and (location is search(skip_pattern) or title is search(skip_pattern))) }}

actions:
  - action: rivian.plan_trip
    data:
      device_id: !input vehicle
      location: "{{ location }}"
    response_variable: plan
  # other events with a location that start before this one
  - action: calendar.get_events
    target:
      entity_id: !input calendars
    data:
      start_date_time: "{{ now().isoformat() }}"
      end_date_time: "{{ (as_datetime(start) - timedelta(seconds=1)).isoformat() }}"
    response_variable: upcoming
  - variables:
      tracker: "{{ device_entities(vehicle) | select('search', '^device_tracker[.]') | first | default('') }}"
      estimated_drive: "{{ (plan.drive_seconds * traffic_factor) | int }}"
      depart_time: >-
        {% set t = as_datetime(start) | as_local - timedelta(seconds=estimated_drive) %}
        {{ t.strftime('%H:%M') if t > now() else '' }}
      google_seconds: 0
  # Google's traffic-aware drive time, when a Google Travel Time entry is set
  - if:
      - condition: template
        value_template: "{{ google_entry != '' and tracker != '' and state_attr(tracker, 'latitude') is not none and (plan.destination.address | default('', true)) != '' }}"
    then:
      - action: google_travel_time.get_travel_times
        continue_on_error: true
        # Render one mapping so entity IDs and addresses remain strings.
        data: >-
          {% set data = dict(config_entry_id=google_entry, origin=tracker,
                             destination=plan.destination.address, traffic_model='best_guess') %}
          {{ dict(data, departure_time=depart_time) if depart_time != '' else data }}
        response_variable: google
      - variables:
          google_seconds: >-
            {{ google.routes[0].duration | default(0, true)
               if google is defined and (google.routes | default([], true)) else 0 }}
  - variables:
      travel_seconds: >-
        {{ ((google_seconds if google_seconds | int > 0 else estimated_drive) + (plan.charge_seconds if include_charging else 0)) | int }}
      destination: "{{ [plan.destination.name, plan.destination.address] | select | join(', ') or location }}"
      leave_by: "{{ (as_datetime(start) - timedelta(seconds=travel_seconds + buffer_minutes * 60)) | as_local }}"
      early_at: "{{ [now(), today_at(earliest_time)] | max | string }}"
      send_at: >-
        {% set t = [as_datetime(leave_by), now()] | max %}
        {% set earliest = today_at(earliest_time).replace(year=t.year, month=t.month, day=t.day) %}
        {{ [t, earliest] | max | string }}
      is_next: >-
        {% set ns = namespace(n=0) %}
        {% for ev in upcoming.values() | map(attribute='events') | sum(start=[]) %}
          {% set loc = ev.location | default('', true) %}
          {% if loc != '' and 'T' in ev.start and as_timestamp(ev.start) < as_timestamp(start)
                and not (skip_pattern and (loc is search(skip_pattern) or (ev.summary | default('', true)) is search(skip_pattern))) %}
            {% set ns.n = ns.n + 1 %}
          {% endif %}
        {% endfor %}
        {{ ns.n == 0 }}
      summary: >-
        {{ destination }}. Leave by {{ leave_by | as_timestamp | timestamp_custom('%-I:%M %p') }}
        ({{ (travel_seconds / 60) | round | int }} min{{ ' with traffic' if google_seconds | int > 0 else ' est.' }}
        {%- if plan.charge_seconds and include_charging %}, incl. {{ (plan.charge_seconds / 60) | round | int }} min charging{% endif %}).
  # One send sequence for both phases; merge phases that become due together.
  - variables:
      last_sent: 0
      sends: >-
        {% set ns = namespace(items=[]) %}
        {% if send_mode != 'just_in_time' and is_next
              and (send_mode == 'early' or as_timestamp(early_at) < as_timestamp(send_at)) %}
          {% set ns.items = ns.items + [dict(at=early_at, title='Loaded: ' ~ title)] %}
        {% endif %}
        {% if send_mode != 'early' %}
          {% set ns.items = ns.items + [dict(at=send_at, title='Time to leave: ' ~ title)] %}
        {% endif %}
        {{ ns.items }}
  - repeat:
      for_each: "{{ sends }}"
      sequence:
        - if:
            - condition: template
              value_template: >-
                {{ as_timestamp(repeat.item.at) > last_sent
                   and as_timestamp(repeat.item.at) < as_timestamp(start) }}
          then:
            - delay:
                seconds: "{{ [0, as_timestamp(repeat.item.at) - as_timestamp(now())] | max }}"
            - wait_template: "{{ is_state(gear_sensor, 'Park') }}"
              timeout: !input max_park_wait
              continue_on_timeout: false
            # Park may arrive after midnight or after the event has started.
            - if:
                - condition: template
                  value_template: "{{ today_at(earliest_time) <= now() and as_timestamp(now()) < as_timestamp(start) }}"
              then:
                - action: rivian.send_destination
                  data:
                    device_id: !input vehicle
                    location: "{{ destination }}"
                    replace: "{{ replace }}"
                - variables:
                    last_sent: "{{ as_timestamp(now()) }}"
                - if:
                    - condition: template
                      value_template: "{{ notify_service != '' }}"
                  then:
                    - action: "{{ notify_service }}"
                      data:
                        title: "{{ repeat.item.title }}"
                        message: "{{ summary }}"
